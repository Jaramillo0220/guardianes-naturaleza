<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4d3a">
<meta name="description" content="Un juego para aplicar lo aprendido sobre el impacto de las actividades humanas en la naturaleza.">
<title>Guardianes de la Naturaleza</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ═══ PANTALLA DE INICIO ═══ -->
  <section id="p-inicio" class="pantalla activa" aria-label="Inicio">
    <div class="fondo" id="inicio-fondo"></div>
    <div class="hojas" aria-hidden="true"></div>
    <div class="inicio-contenido">
      <div class="letrero">
        <span class="cuerda izq" aria-hidden="true"></span><span class="cuerda der" aria-hidden="true"></span>
        <span class="musgo" aria-hidden="true"></span>
        <h1><span class="t1">Guardianes</span><span class="t2">de la naturaleza</span></h1>
      </div>
      <p class="subtitulo">Una aventura para salvar nuestro planeta</p>
      <div class="cuarteto" id="cuarteto" aria-hidden="true"></div>
      <div class="botones">
        <button class="btn btn-madera" id="btn-comenzar">Comenzar aventura</button>
        <button class="btn btn-hoja" id="btn-continuar" hidden>Continuar aventura</button>
        <button class="btn btn-hoja" id="btn-ayuda">¿Cómo jugar?</button>
      </div>
    </div>
  </section>

  <!-- ═══ SELECCIÓN DE PERSONAJE ═══ -->
  <section id="p-personaje" class="pantalla" aria-label="Elige personaje">
    <div class="fondo fondo-borroso" id="personaje-fondo"></div>
    <div class="velo"></div>
    <div class="personaje-contenido">
      <h2 class="titulo-pantalla">Elige a tu guardián</h2>
      <div class="tarjetas" id="tarjetas" role="radiogroup" aria-label="Personajes"></div>
      <div class="nombre-panel" id="nombre-panel" hidden>
        <label for="input-nombre">¿Cómo se llamará tu guardián?</label>
        <div class="nombre-fila">
          <input id="input-nombre" maxlength="14" autocomplete="off" spellcheck="false">
          <button class="btn btn-madera" id="btn-entrar">Entrar al bosque</button>
        </div>
      </div>
      <button class="btn-volver" id="btn-volver-inicio">Volver al inicio</button>
    </div>
  </section>

  <!-- ═══ MAPA DEL SENDERO ═══ -->
  <section id="p-mapa" class="pantalla" aria-label="Mapa">
    <div class="mapa-capa" id="mapa-capa"></div>
    <div class="neblina"></div>
    <div class="calor"></div>
    <p class="mapa-pie" id="mapa-pie"></p>
    <div id="revelacion" class="revelacion" hidden role="status"></div>
  </section>

  <!-- ═══ ZONA ═══ -->
  <section id="p-zona" class="pantalla" aria-label="Zona">
    <div class="escena-capa" id="escena-capa"></div>
    <div class="neblina"></div>
    <div class="calor"></div>
    <div class="objetivo" id="objetivo" hidden></div>
    <div class="ver-escena" id="ver-escena" hidden></div>
    <div class="pista-paneo" id="pista-paneo" aria-hidden="true"><span class="mano">👆</span> Desliza para explorar</div>
  </section>

  <!-- ═══ FINAL ═══ -->
  <section id="p-final" class="pantalla" aria-label="Resultado">
    <div class="fondo" id="final-fondo"></div>
    <div class="neblina"></div>
    <div class="calor"></div>
    <div class="final-contenido" id="final-contenido"></div>
  </section>

  <!-- ═══ CAPAS GLOBALES ═══ -->
  <header id="hud" hidden>
    <div class="hud-chip hud-guardian"><span class="hud-retrato" id="hud-retrato"></span><span id="hud-nombre"></span></div>
    <div class="hud-chip hud-corazones" id="hud-corazones" role="img"></div>
    <div class="hud-chip hud-puntos"><span aria-hidden="true">⭐</span><span id="hud-puntos">0</span></div>
    <button class="hud-chip hud-planeta" id="hud-planeta" aria-expanded="false" aria-controls="panel-planeta" aria-label="Estado del planeta">
      <span aria-hidden="true">🌎</span><span id="hud-salud">50%</span>
    </button>
  </header>
  <div id="panel-planeta" hidden></div>

  <div id="dialogo" hidden role="dialog" aria-live="polite">
    <div class="dlg-retrato" id="dlg-retrato"></div>
    <div class="dlg-cuerpo">
      <p class="dlg-nombre" id="dlg-nombre"></p>
      <p class="dlg-texto" id="dlg-texto"></p>
      <p class="dlg-sigue">Toca para continuar</p>
    </div>
  </div>

  <div id="modal" hidden><div class="modal-tarjeta" id="modal-tarjeta" role="dialog" aria-modal="true"></div></div>

  <button id="btn-sonido" aria-label="Silenciar">🔊</button>
  <div id="flotantes" aria-hidden="true"></div>
  <div id="toast" role="status"></div>
  <div id="transicion" aria-hidden="true"><div class="cortina"><span id="cortina-texto"></span></div></div>
</div>

<script src="js/personajes.js"></script>
<script src="js/escenas.js"></script>
<script src="js/mapa.js"></script>
<script src="js/audio.js"></script>
<script src="js/zonas.js"></script>
<script src="js/juego.js"></script>
</body>
</html>
